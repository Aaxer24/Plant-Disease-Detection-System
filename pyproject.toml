[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-disease-detection"
version = "1.0.0"
description = "Production-grade multi-crop (14 crops, 38 classes) plant disease detection API and training pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pillow>=10.4.0",
    "numpy>=1.26.4",
    "tensorflow>=2.16.2",
    "groq>=1.6.0",
    "pydantic-settings>=2.4.0",
    "mlflow>=2.15.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5.0",
]
train = [
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "dvc>=3.55",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Long descriptive prose strings, not code — wrapping would hurt readability.
"src/plant_api/knowledge/knowledge_base.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
