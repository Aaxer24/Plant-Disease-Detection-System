# Pinned theme — deliberate, not auto-detected. Custom CSS in app/streamlit_app.py
# uses these EXACT same colors, so nothing depends on guessing the visitor's
# OS/browser light-vs-dark preference.
[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#151F32"
textColor = "#E5E9F0"
font = "sans serif"

[browser]
gatherUsageStats = false
