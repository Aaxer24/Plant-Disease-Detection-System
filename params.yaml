# Training hyperparameters, tracked by DVC (dvc.yaml stages reference these
# via `params:`) so every pipeline run and its metrics are reproducible and
# comparable (`dvc metrics diff`, `dvc exp show`).
prepare:
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 123

train:
  image_size: 256
  channels: 3
  batch_size: 16
  epochs: 15
  learning_rate: 0.001
  early_stopping_patience: 8
  seed: 123
