# Canonical class list — single source of truth for both the training
# pipeline (label order) and the serving API (display names).
#
# Order matters: it matches sorted(os.listdir(data_dir)), which is the label
# order Keras's image_dataset_from_directory assigns during training. Do not
# reorder without retraining.
classes:
  - name: Pepper__bell___Bacterial_spot
    display_name: Pepper Bacterial Spot
    crop: Pepper
  - name: Pepper__bell___healthy
    display_name: Pepper Healthy
    crop: Pepper
  - name: Potato___Early_blight
    display_name: Potato Early Blight
    crop: Potato
  - name: Potato___Late_blight
    display_name: Potato Late Blight
    crop: Potato
  - name: Potato___healthy
    display_name: Potato Healthy
    crop: Potato
  - name: Tomato_Bacterial_spot
    display_name: Tomato Bacterial Spot
    crop: Tomato
  - name: Tomato_Early_blight
    display_name: Tomato Early Blight
    crop: Tomato
  - name: Tomato_Late_blight
    display_name: Tomato Late Blight
    crop: Tomato
  - name: Tomato_Leaf_Mold
    display_name: Tomato Leaf Mold
    crop: Tomato
  - name: Tomato_Septoria_leaf_spot
    display_name: Tomato Septoria Leaf Spot
    crop: Tomato
  - name: Tomato_Spider_mites_Two_spotted_spider_mite
    display_name: Tomato Spider Mites (Two-Spotted)
    crop: Tomato
  - name: Tomato__Target_Spot
    display_name: Tomato Target Spot
    crop: Tomato
  - name: Tomato__Tomato_YellowLeaf__Curl_Virus
    display_name: Tomato Yellow Leaf Curl Virus
    crop: Tomato
  - name: Tomato__Tomato_mosaic_virus
    display_name: Tomato Mosaic Virus
    crop: Tomato
  - name: Tomato_healthy
    display_name: Tomato Healthy
    crop: Tomato

# Serving / MLflow / model-file defaults (paths are relative to project root).
#
# mlflow_tracking_uri: assumes the shared MLflow server is reachable at
# localhost:5000 (e.g. via `docker compose up`, which also runs the API and
# frontend against the same server). Override with the MLFLOW_TRACKING_URI
# env var if you're running training/serving somewhere that URL doesn't
# resolve — both src/models/train.py and the API's Settings honor it. If the
# server isn't reachable, MLflow tracking is disabled with a warning rather
# than failing the run.
model_dir: models
model_name: plant_disease_model
mlflow_tracking_uri: http://localhost:5000
mlflow_experiment_name: plant-disease-detection
mlflow_training_experiment_name: plant-disease-training
