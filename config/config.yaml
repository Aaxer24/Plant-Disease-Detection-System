# Serving / MLflow / model-file defaults (paths are relative to project root).
#
# mlflow_tracking_uri: assumes the shared MLflow server is reachable at
# localhost:5000 (e.g. via `docker compose up`, which also runs the API and
# frontend against the same server). Override with the MLFLOW_TRACKING_URI
# env var if you're running training/serving somewhere that URL doesn't
# resolve — both src/models/train.py and the API's Settings honor it. If the
# server isn't reachable, MLflow tracking is disabled with a warning rather
# than failing the run.
model_dir: models
model_name: plant_disease_model
mlflow_tracking_uri: http://localhost:5000
mlflow_experiment_name: plant-disease-detection
mlflow_training_experiment_name: plant-disease-training
