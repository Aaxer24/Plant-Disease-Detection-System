stages:
  prepare:
    cmd: python scripts/make_dataset.py
    deps:
      - data/raw/images
      - src/data/make_dataset.py
      - config/config.yaml
    params:
      - prepare.train_split
      - prepare.val_split
      - prepare.test_split
      - prepare.seed
    outs:
      - data/processed/train
      - data/processed/val
      - data/processed/test

# cache: false — DVC only orchestrates this stage (reruns it when deps change);
# it doesn't version these files. Model versioning is MLflow's job.
  train:
    cmd: python scripts/train.py
    deps:
      - data/processed/train
      - data/processed/val
      - src/models/train.py
      - src/models/model.py
      - src/data/preprocess.py
      - config/config.yaml
    params:
      - train.image_size
      - train.channels
      - train.batch_size
      - train.epochs
      - train.learning_rate
      - train.early_stopping_patience
      - train.seed
      - train.fine_tune_epochs
      - train.fine_tune_learning_rate
      - train.fine_tune_unfreeze_layers
      - train.fine_tune_early_stopping_patience
    outs:
      # filename follows config.yaml's model_name (default plant_disease_model) — keep the two in sync if rename it there.
      - models/plant_disease_model.keras:
          cache: false

  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - data/processed/test
      - models/plant_disease_model.keras
      - src/models/evaluate.py
    outs:
      - reports/evaluation.txt:
          cache: false
      - reports/figures/confusion_matrix.png:
          cache: false
      - reports/figures/sample_predictions.png:
          cache: false
      - reports/figures/training_curve.png:
          cache: false
